name: Publish to NPM

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Jest and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run editorconfig
      - run: npm run lint
      - run: npm run test

  build:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    # Trusted publishing: npm checks this workflow's OIDC identity instead of a token.
    # Configured on npmjs.com under the package's Settings → Trusted Publisher.
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Update npm (trusted publishing needs npm 11.5.1 or newer)
        run: npm install -g npm@11
      - name: Install dependencies and build 🔧
        run: npm ci && npm run full-build
      - name: Publish package on NPM 📦
        run: npm publish
