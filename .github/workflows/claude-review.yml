name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Use `gh pr diff` and `gh pr view` to read it.

            Focus on correctness bugs, regressions and missing tests. Skip style
            nitpicks that the editorconfig check already covers.

            This repo is an npm workspaces monorepo (`packages/core` is the
            `json-custom-view` package, `packages/react` is
            `@json-custom-view/react`). Releases are automated by release-please,
            so a reviewer must enforce these rules:
            - The PR title must follow Conventional Commits, and its type must
              match the change: `fix:` for bug fixes, `feat:` for new features,
              `!` or `BREAKING CHANGE:` for breaking changes, and `docs:`,
              `chore:`, `ci:`, `test:`, `build:` or `refactor:` for changes that
              should not release. Say so if the type looks wrong.
            - Outside Release PRs from release-please, `version` in any
              `package.json`, `.release-please-manifest.json` and `CHANGELOG.md`
              must not be edited by hand. The one exception: a PR that adds a
              new package to `release-please-config.json` also adds its
              starting version to the manifest, matching its `package.json`.
            - If the public API or the settings of `json-custom-view` change
              (`packages/core/src/api/api.ts`, `packages/core/src/settings.ts`,
              `packages/core/src/types.d.ts`), `packages/core/src/api/api.d.ts`
              and the settings table in `packages/core/README.md` must be
              updated to match.

            Post specific issues as inline comments with
            `mcp__github_inline_comment__create_inline_comment`. Then post one
            summary with `gh pr comment` that ends in a clear verdict:
            "Approve" or "Changes requested".
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
