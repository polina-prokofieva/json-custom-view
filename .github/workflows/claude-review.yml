name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Use `gh pr diff` and `gh pr view` to read it.

            Focus on correctness bugs, regressions and missing tests. Skip style
            nitpicks that the editorconfig check already covers.

            This repo has release rules a reviewer must enforce, because every
            merge to `main` publishes to npm automatically:
            - If the PR changes anything under `src/`, `package.json` "version"
              must be bumped compared to `main`. Otherwise the publish fails.
            - If the public API or the settings change (`src/api/api.ts`,
              `src/settings.ts`, `src/types.d.ts`), `src/api/api.d.ts` and the
              settings table in `Readme.md` must be updated to match.

            Post specific issues as inline comments with
            `mcp__github_inline_comment__create_inline_comment`. Then post one
            summary with `gh pr comment` that ends in a clear verdict:
            "Approve" or "Changes requested".
          claude_args: >-
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
