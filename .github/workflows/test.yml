name: Test

on: pull_request

jobs:
  test:
    name: Jest and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run editorconfig
      - run: npm run lint
      - run: npm run test
