name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Jest and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run editorconfig
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Check that the npm packages contain their build output
        # --ignore-scripts skips prepack, so this checks what "npm run build" produced.
        run: |
          core=$(npm pack --dry-run --json --ignore-scripts --workspace=json-custom-view)
          grep -q '"path": "build/api.js"' <<< "$core"
          react=$(npm pack --dry-run --json --ignore-scripts --workspace=@json-custom-view/react)
          grep -q '"path": "dist/index.js"' <<< "$react"
